<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GTA 6 Browser</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      overscroll-behavior: none;
    }
    video#clip {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #000;
      border: 0;
    }
    #overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      background: transparent;
    }
  </style>
</head>
<body>
  <video id="clip" src="video.mp4" autoplay playsinline loop preload="auto"></video>
  <div id="overlay"></div>
  <script>
    var video = document.getElementById('clip');

    function goFullscreen() {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen || el.mozRequestFullScreen || el.msRequestFullscreen;
      if (!req) return;
      try {
        var ret = req.call(el);
        if (ret && typeof ret.catch === 'function') ret.catch(function () {});
      } catch (e) {}
    }

    function isFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement || document.webkitCurrentFullScreenElement || document.mozFullScreenElement || document.msFullscreenElement);
    }

    function tryPlayUnmuted() {
      video.muted = false;
      video.volume = 1;
      var p = video.play();
      if (p && typeof p.then === 'function') {
        p.catch(function () {
          video.muted = true;
          video.play().catch(function () {});
        });
      }
    }

    function unlockAndPlay() {
      video.muted = false;
      video.volume = 1;
      video.play().catch(function () {});
      goFullscreen();
    }

    function onInteract() {
      if (!isFullscreen()) goFullscreen();
      video.muted = false;
      video.volume = 1;
      video.play().catch(function () {});
    }

    document.addEventListener('contextmenu', function (e) {
      e.preventDefault();
    });

    ['pointerdown', 'touchstart', 'keydown'].forEach(function (type) {
      document.addEventListener(type, onInteract, true);
    });

    goFullscreen();
    if (video.readyState >= 2) {
      tryPlayUnmuted();
    } else {
      video.addEventListener('canplay', tryPlayUnmuted, { once: true });
      tryPlayUnmuted();
    }
  </script>
</body>
</html>
